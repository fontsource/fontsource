packages:
  - packages/*
  - api
  - website
  - registry

allowBuilds:
  '@parcel/watcher': true
  '@posthog/cli': true
  core-js: false
  esbuild: true
  msw: false
  sharp: true
  workerd: true

catalog:
  '@biomejs/biome': 2.5.4
  '@cloudflare/vite-plugin': 1.55.0
  '@vitest/coverage-v8': 4.1.11
  esbuild: 0.28.2
  knip: 6.32.0
  tsdown: 0.22.9
  tsx: 4.23.13
  typescript: 7.0.2
  vite: 8.3.0
  vitest: 4.1.11
  wrangler: 4.134.0

catalogs:
  node20:
    '@types/node': 20.19.43
  node24:
    '@types/node': 24.13.5

catalogMode: manual
cleanupUnusedCatalogs: true
engineStrict: true
injectWorkspacePackages: true
strictPeerDependencies: true
syncInjectedDepsAfterScripts:
  - build
