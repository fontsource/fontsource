name: API Tests
on:
  pull_request:
    branches: [main]
    paths:
      - "api/worker/**"
      - "packages/core/**"
      - "website/app/generated/api/**"
      - "website/app/routes/*sitemap.xml*.tsx"
      - "website/app/utils/api.server.ts"
      - "website/app/routes/fonts.$id.*.tsx"
      - "website/tsconfig.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/tests-api.yml"

  push:
    branches: [main]
    paths:
      - "api/worker/**"
      - "packages/core/**"
      - "website/app/generated/api/**"
      - "website/app/routes/*sitemap.xml*.tsx"
      - "website/app/utils/api.server.ts"
      - "website/app/routes/fonts.$id.*.tsx"
      - "website/tsconfig.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/tests-api.yml"

jobs:
  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/worker

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Generate website API client
        run: bun run generate:website-client

      - name: Check generated website API client
        run: test -z "$(git -C ../.. status --short --untracked-files=all -- website/app/generated/api)"

      - name: Run typecheck
        run: bun run typecheck

      - name: Run website typecheck
        working-directory: website
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Run build
        run: bun run build
